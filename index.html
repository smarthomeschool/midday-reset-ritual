<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midday Reset Ritual</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #faf7f2;
      color: #1f2937;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 10px 0;
      line-height: 1.2;
    }
    p {
      margin: 0 0 18px 0;
      line-height: 1.5;
      font-size: 16px;
      color: #374151;
    }
    button {
      border: 0;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      background: #2f6f5e;
      color: white;
      font-weight: 600;
    }
    button:active { transform: translateY(1px); }
    .output {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #f2faf6;
      border: 1px solid rgba(47,111,94,0.18);
      display: none;
      white-space: pre-line;
      font-size: 17px;
      line-height: 1.55;
      color: #0f172a;
    }
    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #6b7280;
    }
    .footer {
      margin-top: 18px;
      font-size: 14px;
      color: #6b7280;
    }
    a { color: #2f6f5e; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Midday feeling heavy or scattered?</h1>
      <p>Click once for a gentle reset and a calm next step.</p>

      <button id="resetBtn">🌿 RESET MY DAY</button>

      <div id="output" class="output"></div>

      <div class="hint">Tip: Bookmark this page for the messy middle of the day.</div>

      <!-- Optional soft CTA (uncomment later if you want)
      <div class="footer">
        If this helped, you might like gentle reminders like this when the day feels heavy.
      </div>
      -->
    </div>
  </div>

  <script>
    const resets = [
`This part of the day often feels heavier.
Nothing has gone wrong.
Pause for a breath and let the moment settle.`,

`Midday is a natural slowdown.
You’re not behind.
Choose one small thing and let the rest wait.`,

`You don’t need to push through this moment.
It’s okay to soften the pace.
Take a sip of water and reset gently.`,

`This feeling is familiar to many moms.
You’re not alone in it.
Lower the bar and stay steady.`,

`You’re allowed to stop recalculating the whole day.
Nothing needs fixing right now.
Breathe out and stay here for a moment.`,

`Energy dips are part of the rhythm.
This is not a failure.
Sit down for a minute before moving on.`,

`You don’t need clarity for everything.
Just one calm next step is enough.
Notice what feels least heavy right now.`,

`Midday doesn’t ask for big decisions.
It asks for steadiness.
Do something familiar and grounding.`,

`You’re allowed to change direction.
Plans can soften without meaning anything is wrong.
Pick the simplest option available.`,

`This moment isn’t meant for productivity.
It’s meant for maintenance.
Tidy one small area or clear one surface.`,

`You don’t need to explain yourself.
The day can be quiet here.
Let expectations rest for a while.`,

`This stretch of the day can feel noisy inside.
That’s normal.
Put your feet on the floor and notice the room.`,

`You’re allowed to feel tired and still be doing well.
Nothing is required right now.
Slow your breathing for a few moments.`,

`Midday is often about holding things gently.
Not fixing them.
Stay with what’s already in front of you.`,

`You don’t need a fresh start.
You just need a steadier middle.
Choose calm over progress for now.`,

`This is a pause point, not a problem.
Let the day breathe.
Step outside or look out a window if you can.`,

`You’re not meant to feel motivated all day.
This dip is human.
Keep things simple and familiar.`,

`Nothing needs to be decided right now.
You can wait.
Write down one thought and set it aside.`,

`Midday asks for less thinking, not more.
You’re doing enough.
Return to something steady and known.`,

`You don’t need to catch up.
You’re allowed to stay where you are.
Drink some water and reset your shoulders.`,

`This moment is not asking for effort.
It’s asking for presence.
Notice one thing you can see or hear.`,

`You’re allowed to protect your energy here.
Not everything deserves attention today.
Choose what feels most supportive.`,

`Midday can feel stretched thin.
That doesn’t mean you are.
Pause before the next transition.`,

`You don’t need to be efficient right now.
You need to be kind.
Do the next thing slowly.`,

`This is a quiet checkpoint in the day.
Not a verdict.
Let go of what hasn’t happened yet.`,

`You’re allowed to stop striving.
This part of the day works best with gentleness.
Sit, breathe, and stay grounded.`,

`Midday doesn’t measure success.
It just passes through.
Stay with one small, steady action.`,

`You don’t need to earn rest later.
You can soften now.
Let your body relax before moving on.`,

`This moment doesn’t define the day.
It’s just a moment.
Choose something calming and familiar.`,

`You’re allowed to end the day imperfectly.
Nothing is lost here.
Hold the rest of the day lightly.`
];

    const btn = document.getElementById('resetBtn');
    const out = document.getElementById('output');

    function pickRandomReset() {
      const idx = Math.floor(Math.random() * resets.length);
      return resets[idx];
    }

    btn.addEventListener('click', () => {
      out.style.display = 'block';
      out.textContent = pickRandomReset();
      out.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  </script>
</body>
</html>
<div class="footer">
  <p>If you’d like gentle reminders like this when the day feels heavy, you can save them here.</p>
  <a href="https://olsp.annelizemeyer.com/midday-reset-tool" target="_blank">
    <button style="margin-top:10px;">Save this calm 🌿</button>
  </a>
</div>
